# Copy .env.example to .env, fill it in, then: docker compose up -d --build
services:
  postadmin:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTADMIN_TRUST_PROXY: loopback
    # Only reachable from this machine; the reverse proxy (Caddy/Nginx) adds HTTPS in front.
    ports:
      - "127.0.0.1:7070:7070"
    volumes:
      - postadmin-data:/data

volumes:
  postadmin-data:
