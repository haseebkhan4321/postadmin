<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PostAdmin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23336791'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>PA</text></svg>">
  <link rel="stylesheet" href="/vendor/codemirror/lib/codemirror.css">
  <link rel="stylesheet" href="/vendor/codemirror/addon/hint/show-hint.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="layout">
    <aside id="sidebar">
      <a href="#/" class="brand"><span class="logo">PA</span> PostAdmin <span id="app-version" class="version"></span></a>
      <div class="sidebar-tools">
        <input id="tree-filter" type="search" placeholder="Filter connections & tables  ( / )">
        <button id="conn-add" class="icon-btn" title="New connection">+</button>
        <button id="tree-refresh" class="icon-btn" title="Reload tree">&#x21bb;</button>
      </div>
      <nav id="tree"></nav>
    </aside>
    <div id="resizer"></div>
    <main id="main">
      <div id="update-banner" hidden></div>
      <header id="topbar">
        <nav id="breadcrumbs"></nav>
        <button id="theme-toggle" class="icon-btn" title="Toggle dark mode">&#x25d0;</button>
      </header>
      <nav id="tabs"></nav>
      <section id="content"></section>
    </main>
  </div>
  <div id="toasts"></div>

  <script src="/vendor/codemirror/lib/codemirror.js"></script>
  <script src="/vendor/codemirror/mode/sql/sql.js"></script>
  <script src="/vendor/codemirror/addon/hint/show-hint.js"></script>
  <script src="/vendor/codemirror/addon/hint/sql-hint.js"></script>
  <script src="/vendor/codemirror/addon/edit/matchbrackets.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
